<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Salma Barrak | Software Engineering Student</title>
  <meta name="description" content="Portfolio of a software engineering student | Full Stack developer | AI & DevOps enthusiast">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://salmaskit.github.io/MyPortfolio/">
  <meta property="og:title" content="Salma Barrak | Software Engineering Student | AI & DevOps Enthusiast">
  <meta property="og:description" content="Portfolio of a software engineering student | Full Stack developer | AI enthusiast">
  <meta property="og:image" content="https://salmaskit.github.io/MyPortfolio/assets/images/Apps/Portfolio/portfolio_mockup.png">
  <meta name="theme-color" content="#fafaf8">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="translations.js"></script>
  <script src="js/portfolio-data.js"></script>
</head>
<body>
  <div id="navbar"></div>
  <header id="hero"></header>
  <main id="main"></main>
  <div id="footer"></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  
  <!-- Terminal/CLI System -->
  <button id="cli-fab" class="cli-fab" aria-label="Open Terminal" title="Developer Console">
    <i class="fas fa-terminal"></i>
  </button>

  <div id="cli-overlay" class="cli-overlay" role="dialog" aria-modal="true" aria-label="Developer Console">
    <div class="cli-modal">
      <div class="cli-header">
        <div class="cli-title">Salma Barrak — Developer Console</div>
        <div class="cli-controls">
          <div class="win-btn" data-action="minimize"><i class="fas fa-minus"></i></div>
          <div class="win-btn" data-action="maximize"><i class="far fa-square"></i></div>
          <div class="win-btn close" data-action="close"><i class="fas fa-times"></i></div>
        </div>
      </div>
      <div class="cli-body" id="cli-body">
        <div class="cli-line intro" data-i18n="cli_intro"></div>
        <div id="cli-output"></div>
        <div class="cli-input-line">
          <span class="cli-prompt">PS C:\Users\Salma></span>
          <input type="text" id="cli-input" autofocus autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>
  </div>
  
  <script src="js/loader.js"></script>
</body>
</html>
